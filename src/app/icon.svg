<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- night ground of an unfamiliar world -->
  <rect width="64" height="64" rx="12" fill="#1a1512"/>
  <!-- the second dawn: a sun clearing an alien horizon -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#6b3f1d"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9a0"/>
      <stop offset="100%" stop-color="#e8913c"/>
    </linearGradient>
  </defs>
  <rect x="0" y="10" width="64" height="30" fill="url(#sky)"/>
  <circle cx="32" cy="40" r="13" fill="url(#star)"/>
  <!-- horizon line -->
  <rect x="0" y="39" width="64" height="25" fill="#241c16"/>
  <!-- ridge -->
  <path d="M0 41 L14 35 L26 40 L38 33 L52 39 L64 34 L64 64 L0 64 Z" fill="#3a2c22"/>
  <!-- the lander and the first two habitats, small against it -->
  <rect x="27" y="30" width="4" height="9" rx="1.6" fill="#c8ccd2"/>
  <rect x="34" y="33" width="6" height="4" rx="2" fill="#9aa0a8"/>
  <rect x="19" y="34" width="5" height="3.5" rx="1.6" fill="#9aa0a8"/>
</svg>
